user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # برای پراکسیِ مختلطِ HTTP+WebSocket (مثلاً noVNC): فقط درخواست‌های upgrade
    # هدرِ Connection: upgrade می‌گیرند، بقیه خالی.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # لاگ
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # عملکرد
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # فشرده‌سازی gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # امنیت
    server_tokens off;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
    # محدودیت سخت‌گیرانه برای auth (login/refresh) — جلوگیری از brute-force
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_status 429;

    # Upstream
    upstream api_backend {
        server api:8000;
    }

    upstream website_frontend {
        server frontend-website:80;
    }

    upstream admin_frontend {
        server frontend-admin:80;
    }

    # مدیا سرور WebRTC (لایو ترید): با resolver پویا در location پراکسی می‌شود
    # (upstream استاتیک حذف شد چون nginx در زمان load روی resolve آن سخت‌گیر است)

    # شامل کانفیگ‌های سایت
    include /etc/nginx/conf.d/*.conf;
}
