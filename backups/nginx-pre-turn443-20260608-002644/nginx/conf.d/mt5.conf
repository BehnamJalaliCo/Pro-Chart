# دسکتاپِ متاتریدرِ سرور (Selkies WebRTC) — mt5.fx.trade-future.ir
server {
    listen 80;
    server_name mt5.fx.trade-future.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mt5.fx.trade-future.ir;

    ssl_certificate /etc/letsencrypt/live/mt5.fx.trade-future.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mt5.fx.trade-future.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # (auth موقتاً برداشته شد تا WebSocketِ سیگنالینگ بدونِ مشکلِ رمز وصل شود)

    # کلِ ترافیک (وب + سیگنالینگِ WebSocket: /ws و /webrtc/signalling) به Selkies
    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mt5_host mt5;
        proxy_pass http://$mt5_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 10M;
    }
}
