# وب‌سایت اصلی — FX.trade-future.ir
server {
    listen 80;
    server_name FX.trade-future.ir;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ریدایرکت به HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name FX.trade-future.ir;

    # SSL
    ssl_certificate /etc/letsencrypt/live/fx.trade-future.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fx.trade-future.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # فرانت‌اند
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://website_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # محدودیت سخت‌گیرانه برای auth — جلوگیری از brute-force
    location ~ ^/api/auth/(login|refresh) {
        limit_req zone=auth burst=3 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # چت زندهٔ لایو — WebSocket (نیازمند upgrade؛ قبل از /api/)
    location /api/live/ws/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # لایو ترید — WHEP (پخش) به MediaMTX (resolver پویا، بدون upstream استاتیک)
    location ~ ^/live/whep/(.*)$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mtx_host mediamtx;
        proxy_pass http://$mtx_host:8889/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
    }

    # لایو ترید — WHIP (انتشار وبکمِ مالک) به MediaMTX
    location ~ ^/live/whip/(.*)$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mtx_host mediamtx;
        client_max_body_size 5m;
        proxy_pass http://$mtx_host:8889/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
    }

    # API
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket برای قیمت لحظه‌ای
    location /ws/ {
        proxy_pass http://api_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

# API subdomain — api.FX.trade-future.ir
server {
    listen 80;
    server_name api.FX.trade-future.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
