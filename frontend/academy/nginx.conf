server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ⚠️ sw.js و manifest هرگز کش نشوند — وگرنه service worker آپدیت نمی‌شود و کاربر روی
    # نسخهٔ قدیمی گیر می‌کند. (باید قبل از قانونِ کلیِ .js بیاید تا اولویت داشته باشد.)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # فایل‌های هش‌دار: کشِ بلندمدت (نامِ هش‌دار، پس امن است)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html هرگز کش نشود (جلوگیری از خطای چانکِ کهنه بعد از دیپلوی)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location /health { access_log off; return 200 '{"status":"ok"}'; add_header Content-Type application/json; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
