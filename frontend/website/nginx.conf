# ── تشخیصِ کراولر/شبکهٔ اجتماعی برای dynamic rendering (HTMLِ سروری به جای شِلِ SPA) ──
map $http_user_agent $is_crawler {
    default 0;
    "~*(googlebot|google-inspectiontool|bingbot|yandex|duckduckbot|baiduspider|slurp|facebookexternalhit|facebot|twitterbot|linkedinbot|whatsapp|telegrambot|applebot|petalbot|semrushbot|ahrefsbot|mj12bot|dotbot|bytespider|discordbot|skypeuripreview|embedly|redditbot|pinterest|vkshare|w3c_validator|chrome-lighthouse|ia_archiver)" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SEO: sitemap/robots/IndexNow پویا از API (در ریشهٔ دامنه) ──
    location = /sitemap.xml {
        proxy_pass http://api:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/sitemap-[a-z]+\.xml$ {
        proxy_pass http://api:8000$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://api:8000/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /indexnow-key.txt {
        proxy_pass http://api:8000/indexnow-key.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /rss.xml {
        proxy_pass http://api:8000/rss.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # index.html هرگز کش نشود تا بعد از هر دیپلوی، مرورگر چانک‌های جدید را بگیرد
    # (وگرنه index.htmlِ قدیمی به فایل‌های هش‌دارِ پاک‌شده اشاره می‌کند → خطای لود)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires off;
    }

    # SPA fallback — کراولرها HTMLِ سروریِ /seo/render را می‌گیرند، کاربرِ انسانی همان SPA را
    location / {
        if ($is_crawler) {
            proxy_pass http://api:8000/seo/render$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
