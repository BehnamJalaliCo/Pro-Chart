server {
    listen 4173;
    server_name prochart.local;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;

    # QA-only proxy to the already-running local API. The preview container must use
    # host networking; this config must never be promoted to a production image.
    location ~ ^/api(/v1)?/ {
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host prochart.local;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location /health {
        access_log off;
        return 200 '{"status":"ok","scope":"qa-preview"}';
        add_header Content-Type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
