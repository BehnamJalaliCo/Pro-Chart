server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # فایل‌های هش‌دار: کشِ بلندمدت
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html هرگز کش نشود (جلوگیری از خطای چانکِ کهنه بعد از دیپلوی)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location /health { access_log off; return 200 '{"status":"ok"}'; add_header Content-Type application/json; }

    # خروج از پرتال فقط از دو مسیر داخلی و مقصد ثابتِ API انجام می‌شود.
    location = /go/lbank {
        access_log off;
        proxy_pass http://api:8000/go/lbank;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /go/oneroyal {
        access_log off;
        proxy_pass http://api:8000/go/oneroyal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
