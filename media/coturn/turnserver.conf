# ───────────────── سخت‌سازیِ ضدِّ open-relay و سوءاستفاده ─────────────────
# جلوگیری از relay به شبکه‌های داخلی/loopback/متادیتایِ ابری (حتی با credentialِ لو‌رفته،
# مهاجم نمی‌تواند به سرویس‌های داخلی یا متادیتا برسد — فقط IPهای عمومی، با سقفِ پهنای‌باند)
no-multicast-peers
no-tcp-relay
# استثنا: رلهٔ مدیایِ استریم به شبکهٔ داخلیِ داکر (mediamtx/mt5) — لازم برای WebRTC.
# allowed-peer-ip بر denied-peer-ip اولویت دارد، پس فقط همین زیرشبکه باز می‌شود.
allowed-peer-ip=172.18.0.0-172.18.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# سهمیه و سقفِ پهنای‌باند (جلوگیری از سرقتِ منابع/پهنای‌باند)
total-quota=100
user-quota=50
max-bps=2000000
# امنیتِ پروتکل
stale-nonce=600
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
