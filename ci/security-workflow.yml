name: Security

# اسکنِ امنیتیِ خودکار — ابزارهای استانداردِ متن‌بازِ جامعهٔ امنیت.
# روی هر push/PR و هفتگی اجرا می‌شود. هیچ‌کدام deploy را بلاک نمی‌کنند مگر یافتهٔ بحرانی.
on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'   # هر دوشنبه ۳ بامداد
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  python-sast:
    name: Python SAST (bandit) + CVEs (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanners
        run: pip install bandit[toml] pip-audit
      - name: Bandit (static analysis)
        run: bandit -r src -c pyproject.toml -ll -f txt || true
      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt --desc || true

  deps-and-images:
    name: Trivy (fs + config + dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy config (Dockerfile/IaC) scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'

  dockerfiles:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: error

  npm-audit:
    name: JS dependency audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [frontend/website, frontend/admin, frontend/user]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev || true
