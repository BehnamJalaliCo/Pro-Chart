# پنل کاربری VIP — user.fx.trade-future.ir
server {
    listen 80;
    server_name user.fx.trade-future.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name user.fx.trade-future.ir;

    # تا قبل از گسترشِ گواهی برای user.fx، از گواهیِ fx استفاده می‌شود (هشدارِ نام تا اصلاح).
    ssl_certificate /etc/letsencrypt/live/fx.trade-future.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fx.trade-future.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # فرانت‌اندِ پنلِ کاربری
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://user_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # محدودیتِ سخت‌گیرانه روی ورود/OTP — جلوگیری از brute-force
    location ~ ^/api(/v1)?/user/auth/ {
        limit_req zone=auth burst=5 nodelay;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API پنلِ کاربری — حذفِ پیشوندِ /api یا /api/v1 و فوروارد به backend
    location ~ ^/api(/v1)?/ {
        limit_req zone=api burst=50 nodelay;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
