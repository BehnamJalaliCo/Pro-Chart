# پنل ادمین — Panel.FX.trade-future.ir
server {
    listen 80;
    server_name Panel.FX.trade-future.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name Panel.FX.trade-future.ir;

    ssl_certificate /etc/letsencrypt/live/fx.trade-future.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fx.trade-future.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # فرانت‌اند پنل ادمین
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://admin_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # محدودیت سخت‌گیرانه برای auth — جلوگیری از brute-force
    # فرانت‌اند با پیشوند /api/v1 صدا می‌زند؛ هم /api و هم /api/v1 پشتیبانی می‌شود.
    location ~ ^/api(/v1)?/auth/(login|refresh) {
        limit_req zone=auth burst=3 nodelay;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # چت/کنترل لایو — WebSocket (نیازمند upgrade؛ قبل از api عمومی)
    location ~ ^/api(/v1)?/live/ws/ {
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # دسکتاپِ متاتریدرِ سرور (noVNC) — مالک از پنل به MT5 وصل می‌شود
    location /mt5-desktop/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mt5_host mt5;
        rewrite ^/mt5-desktop/(.*)$ /$1 break;
        proxy_pass http://$mt5_host:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # لایو ترید — انتشار وبکمِ مالک (WHIP) از پنل به MediaMTX (هم‌مبدأ، بدون CORS)
    location ~ ^/live/whip/(.*)$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mtx_host mediamtx;
        client_max_body_size 5m;
        proxy_pass http://$mtx_host:8889/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_read_timeout 300;
    }

    # لایو ترید — پیش‌نمایشِ استریم در پنل (WHEP)
    location ~ ^/live/whep/(.*)$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mtx_host mediamtx;
        proxy_pass http://$mtx_host:8889/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_read_timeout 300;
    }

    # API پنل ادمین — حذف پیشوند /api یا /api/v1 و فوروارد به API
    location ~ ^/api(/v1)?/ {
        limit_req zone=api burst=50 nodelay;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://api_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
