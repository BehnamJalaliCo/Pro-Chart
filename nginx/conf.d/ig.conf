# پنل مستقل اینستاگرام — ig-hub.ir (دامینِ جدید) + ig.trade-future.ir (قدیمی، سازگاری)
server {
    listen 80;
    server_name ig-hub.ir www.ig-hub.ir ig.trade-future.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name ig-hub.ir www.ig-hub.ir;

    ssl_certificate /etc/letsencrypt/live/ig-hub.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ig-hub.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 35m;

    # فرانت‌اندِ پنلِ اینستاگرام
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://ig_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # محدودیتِ سخت‌گیرانه روی ورودِ کاربرِ IG — جلوگیری از brute-force
    location ~ ^/api(/v1)?/ig/auth/ {
        limit_req zone=auth burst=5 nodelay;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — حذفِ پیشوندِ /api و فوروارد به backend
    location ~ ^/api(/v1)?/ {
        limit_req zone=api burst=50 nodelay;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://api_backend;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# سازگاریِ عقب‌رو — دامینِ قبلی ig.trade-future.ir (با certِ چندSANِ fx) به همان پنل
server {
    listen 8443 ssl;
    server_name ig.trade-future.ir;

    ssl_certificate /etc/letsencrypt/live/fx.trade-future.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fx.trade-future.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 35m;

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://ig_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api(/v1)?/ig/auth/ {
        limit_req zone=auth burst=5 nodelay;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api(/v1)?/ {
        limit_req zone=api burst=50 nodelay;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass http://api_backend;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
