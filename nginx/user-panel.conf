# ── پنل کاربری — user.pro-chart.com ─────────────────────────────────────────
# additive: بلاکِ اختصاصی (دقیق‌تر از server_name «_» پس اولویت دارد). جدا از pro-chart.ir.
# هم :80 و هم :443 سرو می‌کند تا با هر حالتِ SSL کلادفلر کار کند.
# SPA از کانتینرِ prochart-user-frontend؛ /api(/v1)/ با strip به سرویسِ api می‌رود.

server {
    listen 80;
    server_name user.pro-chart.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 12m;
    location ~ ^/api(/v1)?/ {
        set $up_api http://api:8000;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass $up_api;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        set $up_user http://prochart-user-frontend:80;
        proxy_pass $up_user;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name user.pro-chart.com;

    ssl_certificate     /etc/letsencrypt/live/user.pro-chart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/user.pro-chart.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 12m;

    # WebSocket قیمتِ زنده
    location /ws/ {
        set $up_api http://api:8000;
        proxy_pass $up_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # REST API — حذفِ پیشوندِ /api یا /api/v1 و فوروارد به بک‌اند
    location ~ ^/api(/v1)?/ {
        set $up_api http://api:8000;
        rewrite ^/api(/v1)?/(.*)$ /$2 break;
        proxy_pass $up_api;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # فرانتِ SPA پنلِ کاربری
    location / {
        set $up_user http://prochart-user-frontend:80;
        proxy_pass $up_user;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
