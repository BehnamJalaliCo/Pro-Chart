# Promtail — کشفِ خودکارِ کانتینرها از طریق Docker socket و ارسالِ لاگ به Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # نامِ کانتینر به‌عنوان لیبلِ container (حذفِ اسلشِ ابتدایی)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      # فقط کانتینرهای همین پروژه (coinepro-fx-*)
      - source_labels: ['__meta_docker_container_name']
        regex: '/coinepro-fx-.*'
        action: keep
