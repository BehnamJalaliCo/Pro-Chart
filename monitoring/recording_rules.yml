# Prometheus recording rules — pre-compute SLI ها
#
# مزیت: dashboard queries سریع‌ترند چون از این aggregations استفاده می‌کنند
# به‌جای محاسبه‌ی sum/rate/histogram_quantile هر بار.
#
# Convention: نام rule با "sli:" یا "slo:" شروع می‌شود.

groups:
  - name: slo_recording
    interval: 30s
    rules:
      # ── API Availability ──
      - record: sli:api_availability:5m
        expr: |
          (
            sum(rate(http_requests_total{status_code!~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) or vector(1)

      - record: sli:api_availability:30d
        expr: |
          (
            sum(rate(http_requests_total{status_code!~"5.."}[30d]))
            /
            sum(rate(http_requests_total[30d]))
          ) or vector(1)

      # ── API Latency ──
      - record: sli:api_latency_seconds:p95:5m
        expr: |
          histogram_quantile(0.95,
            sum by (le, endpoint) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          )

      - record: sli:api_latency_seconds:p99:5m
        expr: |
          histogram_quantile(0.99,
            sum by (le, endpoint) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          )

      # ── Signal latency ──
      - record: sli:signal_latency_seconds:p95:1h
        expr: |
          histogram_quantile(0.95,
            rate(forex_analysis_duration_seconds_bucket[1h])
          )

      # ── Rejection rate ──
      - record: sli:rejection_rate:5m
        expr: |
          sum(rate(forex_risk_rejections_total[5m]))
          /
          (
            sum(rate(forex_signals_generated_total[5m]))
            + sum(rate(forex_risk_rejections_total[5m]))
          )

      # ── data feed liveness ──
      - record: sli:data_feed_up:ratio
        expr: |
          sum(forex_data_feed_status) / count(forex_data_feed_status)

  # ── error budget burn rate ──
  - name: error_budget
    interval: 1m
    rules:
      - record: slo:api_error_budget_burn_rate:1h
        expr: |
          (1 - sli:api_availability:5m)
          / (1 - 0.995)
        # rate > 1 = در حال خوردن error budget سریع‌تر از پیش‌بینی

      - record: slo:api_error_budget_burn_rate:6h
        expr: |
          (1 - avg_over_time(sli:api_availability:5m[6h]))
          / (1 - 0.995)
