# Alertmanager configuration — routing alerts to Telegram.
#
# استفاده:
#   1. ALERTMANAGER_TELEGRAM_BOT_TOKEN و ALERTMANAGER_CHAT_ID در .env
#   2. این فایل در docker-compose.yml به container alertmanager mount شود
#   3. در prometheus.yml این URL را به‌عنوان alertmanager‌ها معرفی کنید

global:
  resolve_timeout: 5m
  smtp_from: 'noreply@coinepro.fx'

# ── templates برای فارسی‌سازی پیام‌ها ──
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ── routing tree ──
route:
  group_by: ['alertname', 'severity', 'category']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'telegram_default'

  routes:
    # critical → فوری به admin
    - matchers:
        - severity = critical
      receiver: 'telegram_critical'
      group_wait: 5s
      repeat_interval: 15m
      continue: true   # همچنین به default فرستاده شود

    # paper trading divergence
    - matchers:
        - category = launch
      receiver: 'telegram_launch'
      repeat_interval: 6h

    # data & API
    - matchers:
        - category =~ "data|api"
      receiver: 'telegram_infra'
      repeat_interval: 30m

    # risk events (circuit breaker etc)
    - matchers:
        - category = risk
      receiver: 'telegram_risk'
      repeat_interval: 1h

# ── inhibit: اگر AllDataFeedsDown آلارم است، آلارم StaleData پنهان شود ──
inhibit_rules:
  - source_matchers: [alertname = AllDataFeedsDown]
    target_matchers: [category = data]
    equal: ['category']

  - source_matchers: [alertname = APIDown]
    target_matchers: [category = api]
    equal: ['category']

# ── receivers ──
receivers:
  - name: 'telegram_default'
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token_file: /etc/alertmanager/secrets/bot_token
        chat_id: ${ALERTMANAGER_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          {{ template "telegram.default" . }}

  - name: 'telegram_critical'
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token_file: /etc/alertmanager/secrets/bot_token
        chat_id: ${ALERTMANAGER_CRITICAL_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          🚨 <b>CRITICAL</b>
          {{ template "telegram.critical" . }}

  - name: 'telegram_risk'
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token_file: /etc/alertmanager/secrets/bot_token
        chat_id: ${ALERTMANAGER_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          ⚠️ <b>RISK</b>
          {{ template "telegram.risk" . }}

  - name: 'telegram_infra'
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token_file: /etc/alertmanager/secrets/bot_token
        chat_id: ${ALERTMANAGER_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          🔧 <b>INFRA</b>
          {{ template "telegram.default" . }}

  - name: 'telegram_launch'
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token_file: /etc/alertmanager/secrets/bot_token
        chat_id: ${ALERTMANAGER_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          🚀 <b>LAUNCH</b>
          {{ template "telegram.default" . }}
