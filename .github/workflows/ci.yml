name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install minimal test deps
        # نصب فقط آن چه برای تست‌های phase 0-4 لازم است
        # (pandas-ta و TA-Lib در محیط Docker production نصب می‌شوند)
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest>=8" "pytest-asyncio>=0.24" \
            "fastapi>=0.115" "pydantic>=2.9" "pydantic-settings>=2.6" \
            "python-jose[cryptography]>=3.3" "passlib[bcrypt]>=1.7" "bcrypt>=4.2" \
            "pandas>=2.2" "numpy>=1.26" \
            "scikit-learn>=1.4" "joblib>=1.4" \
            "redis>=5.2" "sqlalchemy>=2.0" \
            "structlog>=24" "orjson>=3.10" \
            "optuna>=4.0" \
            "starlette>=0.40" "httpx>=0.27"

      - name: Run phase tests
        env:
          DEBUG: "true"
          JWT_SECRET_KEY: "test-secret-key-for-ci-only-do-not-use-in-prod-xyz"
        run: |
          python -m pytest \
            tests/test_phase0_fixes.py \
            tests/test_phase1_backtest.py \
            tests/test_phase2_risk.py \
            tests/test_phase3_optimization.py \
            tests/test_phase4_quality.py \
            -v --tb=short

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6" "mypy>=1.11"

      - name: Run ruff
        run: ruff check src/ tests/ --output-format=github

      - name: Check formatting
        run: ruff format --check src/ tests/

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]>=1.7"

      - name: Run bandit
        # severity مدیوم و بالا — برای جلوگیری از false positive ها
        run: bandit -r src/ -ll -ii --exclude tests/
