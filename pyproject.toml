[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "coinepro-forex-signal-bot"
version = "1.0.0"
description = "CoinePro Professional Forex Signal Platform"
requires-python = ">=3.12"
license = {text = "Proprietary"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/data/mt5_connector.py",
    "src/data/oanda_connector.py",
    "src/data/twelvedata_connector.py",
    "src/data/yfinance_connector.py",
    "*/run_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 1

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# اسکنِ امنیتیِ استاتیک (bandit) — تنظیماتِ پروژه
[tool.bandit]
exclude_dirs = ["tests", "alembic", ".venv", "node_modules", "frontend"]
# B101 assert (تست‌ها)؛ B613 علامتِ راست‌به‌چپِ فارسی (‏) متنِ مشروع است نه trojan-source
skips = ["B101", "B613"]
